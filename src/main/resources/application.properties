spring.application.name=catalog-service-borrador
server.port=8092

# Conexion a MySQL (usuario y clave salen de variables de entorno)
spring.datasource.url=jdbc:mysql://localhost:3306/catalog_borrador_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA: Hibernate solo valida, nunca crea tablas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Flyway: crea las tablas con los scripts SQL
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info